<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
   <meta charset="UTF-8">
   <title>Add Course - Course Organizer</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo-text">personal course organizer</div>
    <nav>
        <a href="Home.html">Home</a>
        <a href="My Courses.html">My Courses</a>
        <a href="Add Courses.html">Add Courses</a>
        <a href="Contact Us.html">Contact Us</a>
    </nav>
</header>

<main>
    <section class="form-container">
        <h2>Add New Course</h2>
        <form>
            <div class="form-group">
                <label>Course Name</label>
                <input type="text" placeholder="e.g. Mathematics">
            </div>

            <div class="form-group">
                <label>Instructor Name</label>
                <input type="text" placeholder="e.g. Dr. Alaa">
            </div>

            <div class="form-group">
                <label>Credit Hours</label>
                <input type="number" min="1" max="5">
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea rows="4" placeholder="Any extra details..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-add">Add Course</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <p>youssefsameh-FCAI2026</p> 
</footer>

</body>
</html>
